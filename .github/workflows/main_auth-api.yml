# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - auth-api

on:
  push:
    branches:
      - main
      - debug-azure-endpoints
    paths:
      - "backend/**"
      - ".github/workflows/**"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Build with dotnet
        run: >
          dotnet build
          backend/src/AutenticationService.Presentation/AutenticationService.Presentation.csproj
          --configuration Release

      - name: dotnet publish
        run: >
          dotnet publish
          backend/src/AutenticationService.Presentation/AutenticationService.Presentation.csproj
          --configuration Release
          --output ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BAB7352BB5944A838DB82AC7EFCF5DDB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5831D83FB2C94467B2FAD92C28813657 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8D0B264F6AE943F2A369F297A0ACFDC7 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "auth-api"
          slot-name: "Production"
          package: ./publish