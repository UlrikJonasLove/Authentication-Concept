<section class="auth-form-shell">
  <div class="auth-form-shell__copy">
    <span class="auth-form-shell__eyebrow">{{ eyebrow() }}</span>
    <h2>{{ title() }}</h2>
    <p>{{ subtitle() }}</p>
  </div>

  <div class="auth-form-shell__body">
    <ng-content />
  </div>

  <p class="auth-form-shell__footer">
    {{ footerPrompt() }}
    <a [routerLink]="footerLink()">{{ footerLinkLabel() }}</a>
  </p>
</section>
